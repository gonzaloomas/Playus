name: Compilar APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: gradle assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk TocaColor.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TocaColor-apk
          path: TocaColor.apk
      - name: Publicar descarga directa
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima -y --cleanup-tag || true
          gh release create ultima TocaColor.apk --title "TocaColor (última versión)" --notes "Descarga TocaColor.apk e instálalo en tu Android."
